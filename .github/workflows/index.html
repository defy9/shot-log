<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backyard shooting log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shots">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF0F1; --surface:#FFFFFF; --ink:#1B252D; --muted:#5E6B75; --line:#CDD3D8;
  --ring:#D9541A; --make:#1F7A5A; --miss:#B7C0C7;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141B21; --surface:#1D262E; --ink:#E9EDEF; --muted:#94A2AD; --line:#33414C;
  --ring:#F0773A; --make:#4FBF93; --miss:#3A4853;
}}
:root[data-theme="dark"]{
  --bg:#141B21; --surface:#1D262E; --ink:#E9EDEF; --muted:#94A2AD; --line:#33414C;
  --ring:#F0773A; --make:#4FBF93; --miss:#3A4853;
}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 1.9rem/1.1 "Barlow Condensed",Impact,sans-serif;margin:8px 0 2px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 20px}
.num{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}

.hero{display:grid;grid-template-columns:auto 1fr;gap:4px 20px;align-items:end;padding:20px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.hero .pct{font-size:5.2rem;line-height:.85;color:var(--ring)}
.hero .pct small{font-size:2.2rem}
.hero .meta{color:var(--muted);font-size:.95rem}
.hero .meta b{color:var(--ink);font-weight:600}
.dots{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--miss)}
.dots i.m{background:var(--make)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-size:1.7rem;line-height:1}
.stat .k{color:var(--muted);font-size:.82rem}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px;margin-bottom:22px}
.chart h2,.log h2,form h2{font:600 1rem/1.2 Barlow,sans-serif;margin:0 0 10px}
.chart svg{width:100%;height:auto;display:block}

form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
input,select{width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.full{grid-column:1/-1}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
button{font:600 1rem Barlow,sans-serif;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
.primary{background:var(--ring);color:#fff;width:100%;margin-top:14px}
.primary:disabled{opacity:.6;cursor:default}
.err{color:#C0392B;font-size:.9rem;margin:8px 0 0;min-height:1em}

.log table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.wrap{overflow-x:auto}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.95rem}
th{font-weight:600;color:var(--muted);font-size:.8rem}
tr:last-child td{border-bottom:0}
td .blocks{color:var(--muted);font-size:.85rem}
.del{background:none;color:var(--muted);padding:4px 8px;font-size:.85rem}
.note{color:var(--muted);font-size:.85rem;margin-top:10px}
.backup{display:flex;gap:10px;margin-top:12px}.backup .ghost{flex:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:600;cursor:pointer;color:var(--ink)}
.live{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:22px}
.live h2{font:600 1rem/1.2 Barlow,sans-serif;margin:0 0 10px}
.shots{display:flex;flex-wrap:wrap;gap:10px;min-height:34px;margin-bottom:10px}
.grp{display:flex;gap:3px;padding:4px 6px;border-radius:8px;background:var(--bg)}
.grp b{font:700 1.25rem/1 "Barlow Condensed",Impact,sans-serif;width:14px;text-align:center}
.grp b.m{color:var(--make)} .grp b.x{color:var(--muted)}
.grp.cur{outline:2px dashed var(--line)}
.empty{color:var(--muted);font-size:.95rem}
.livestats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.95rem;margin-bottom:14px}
.livestats b{color:var(--ink);font-family:"Barlow Condensed",Impact,sans-serif;font-size:1.3rem;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns button{height:96px;font:700 1.6rem "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em;touch-action:manipulation;border-radius:12px}
.make{background:var(--make);color:#fff}
.miss{background:var(--miss);color:var(--ink)}
.btns button:active{transform:scale(.97)}
.row2{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:12px;align-items:end}
.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);height:44px}
.row2 select{margin-top:0;height:44px}
.finish{grid-column:1/-1;background:var(--ring);color:#fff}
.done{display:none;background:var(--make);color:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.done.show{display:block}
.finish.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ring) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.finish.pulse{animation:none}}
.finish:disabled,.ghost:disabled{opacity:.5;cursor:default}
details.manual{margin-bottom:22px}
details.manual summary{cursor:pointer;color:var(--muted);font-size:.95rem;padding:6px 0}
details.manual form{margin-top:10px;margin-bottom:0}
</style>
</head>
<body>
<main>
  <h1>Backyard shooting log</h1>
  <p class="sub" id="sub"></p>
  <section id="hero"></section>
  <section class="stats" id="stats"></section>
  <section class="chart"><h2>FG% by session</h2><div id="chart"></div></section>

  <section class="live" id="live">
    <h2>Live session</h2>
    <div class="done" id="done" role="status"></div>
    <div class="shots" id="shots"></div>
    <div class="livestats" id="livestats"></div>
    <div class="btns">
      <button type="button" class="make" id="bMake">Make</button>
      <button type="button" class="miss" id="bMiss">Miss</button>
    </div>
    <div class="row2">
      <button type="button" class="ghost" id="bUndo">Undo</button>
      <select id="liveSpot" aria-label="Spot">
        <option value="">Spot: mixed / not set</option>
        <option>Free throw</option><option>Elbow</option><option>Midrange</option>
        <option>Corner 3</option><option>Wing 3</option><option>Top 3</option><option>Layups</option>
      </select>
      <button type="button" class="finish" id="bFinish">Finish and save session</button>
    </div>
  </section>

  <details class="manual"><summary>Enter totals instead</summary>
  <form id="f" novalidate="">
    <h2>Log a session</h2>
    <div class="grid">
      <label>Date<input type="date" id="date" required=""></label>
      <label>Spot
        <select id="spot">
          <option value="">Mixed / not set</option>
          <option>Free throw</option><option>Elbow</option><option>Midrange</option>
          <option>Corner 3</option><option>Wing 3</option><option>Top 3</option><option>Layups</option>
        </select>
      </label>
      <label>Makes<input type="number" id="makes" min="0" inputmode="numeric" required=""></label>
      <label>Attempts<input type="number" id="att" min="1" inputmode="numeric" value="50" required=""></label>
      <label class="full">Best streak<input type="number" id="streak" min="0" inputmode="numeric"></label>
      <label class="full">Makes per 10 (optional)<input type="text" id="blocks" placeholder="e.g. 10, 9, 7, 5, 5" inputmode="numeric">
        <span class="hint">Comma separated. Shows when you start fading.</span></label>
    </div>
    <button class="primary" id="save" type="submit">Save session</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  </details>

  <section class="log">
    <h2>All sessions</h2>
    <div class="wrap" id="log"></div>
    <p class="note" id="note"></p>
    <div class="backup"><button type="button" class="ghost" id="bExport">Download backup</button><label class="ghost imp">Restore backup<input type="file" id="fImport" accept="application/json,.json" hidden></label></div>
  </section>
</main>

<script id="state" type="application/json">{"sessions":[{"id":"s1","date":"2026-09-23","makes":36,"att":50,"streak":14,"spot":"","blocks":[]},{"id":"s2","date":"2026-09-25","makes":35,"att":50,"streak":7,"spot":"","blocks":[9,7,8,5,6],"shots":"XXXOXXXXXXXOOXXXXOXXXOXXXOXXXXOXXOXOOOXXOXOOXXXXOX"}]}</script>
<script>
(function(){
  var STATE = JSON.parse(document.getElementById('state').textContent);
  var LS_KEY = 'shotlog-local';
  var artifact = null, readOnly = false;

  // Merge any sessions saved locally (fallback mode) that aren't in the page yet
  try {
    var local = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (local && Array.isArray(local.sessions)) {
      var ids = {}; STATE.sessions.forEach(function(s){ ids[s.id]=1; });
      local.sessions.forEach(function(s){ if(!ids[s.id]) STATE.sessions.push(s); });
    }
  } catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var pct = function(m,a){ return a ? Math.round(m/a*1000)/10 : 0; };
  var fmtDate = function(d){
    var p=d.split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]);
    return dt.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  };
  var sorted = function(){ return STATE.sessions.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }); };

  function render(){
    var s = sorted(), n = s.length;
    $('sub').textContent = n + (n===1?' session':' sessions') + ' logged';
    if(!n){ $('hero').innerHTML=''; $('stats').innerHTML=''; $('chart').innerHTML=''; $('log').innerHTML='<p class="note">Log your first session above.</p>'; return; }

    var last = s[n-1];
    var dots=''; for(var i=0;i<last.att;i++){ var hit = last.shots ? last.shots.charAt(i)==='X' : i<last.makes; dots += '<i'+(hit?' class="m"':'')+'></i>'; }
    $('hero').innerHTML =
      '<div class="hero"><div class="pct num">'+Math.round(pct(last.makes,last.att))+'<small>%</small></div>'+
      '<div class="meta">Latest, '+fmtDate(last.date)+'<br><b>'+last.makes+'/'+last.att+'</b>'+
      (last.spot?' from '+esc(last.spot):'')+(last.streak!=null&&last.streak!==''?', best streak <b>'+last.streak+'</b>':'')+'</div>'+
      '<div class="dots" aria-label="'+last.makes+' makes of '+last.att+'">'+dots+'</div></div>';

    var tm=0,ta=0,best=0,bestPct=0;
    s.forEach(function(x){ tm+=x.makes; ta+=x.att; if(+x.streak>best) best=+x.streak; var p=pct(x.makes,x.att); if(p>bestPct) bestPct=p; });
    $('stats').innerHTML =
      stat(pct(tm,ta)+'%','Overall ('+tm+'/'+ta+')')+
      stat(bestPct+'%','Best session')+
      stat(best,'Longest streak');

    $('chart').innerHTML = chart(s);

    var rows = s.slice().reverse().map(function(x){
      return '<tr><td>'+fmtDate(x.date)+'</td><td class="num">'+x.makes+'/'+x.att+'</td><td class="num">'+pct(x.makes,x.att)+'%</td><td class="num">'+(x.streak===''||x.streak==null?'':x.streak)+'</td><td>'+esc(x.spot||'')+'</td><td class="num">'+(x.blocks&&x.blocks.length?x.blocks.join(', '):'')+'</td>'+
        '<td>'+(readOnly?'':'<button class="del" data-id="'+x.id+'" aria-label="Delete session">Delete</button>')+'</td></tr>';
    }).join('');
    $('log').innerHTML='<table><thead><tr><th>Date</th><th>Made</th><th>FG%</th><th>Streak</th><th>Spot</th><th>Per 10</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  function stat(v,k){ return '<div class="stat"><div class="v num">'+v+'</div><div class="k">'+k+'</div></div>'; }
  function esc(t){ var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

  function chart(s){
    var W=600,H=200,pl=34,pr=12,pt=12,pb=26, iw=W-pl-pr, ih=H-pt-pb;
    var y=function(p){ return pt+ih-(p/100)*ih; };
    var x=function(i){ return s.length===1? pl+iw/2 : pl+i*(iw/(s.length-1)); };
    var g='';
    [0,25,50,75,100].forEach(function(t){ g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+t+'</text>'; });
    var pts=s.map(function(d,i){ return x(i)+','+y(pct(d.makes,d.att)); }).join(' ');
    if(s.length>1) g+='<polyline points="'+pts+'" fill="none" stroke="var(--ring)" stroke-width="2.5" stroke-linejoin="round"/>';
    s.forEach(function(d,i){
      var p=pct(d.makes,d.att);
      g+='<circle cx="'+x(i)+'" cy="'+y(p)+'" r="4.5" fill="var(--ring)"/>';
      if(s.length<=12||i===s.length-1) g+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+(i+1)+'</text>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="FG percentage per session">'+g+'</svg>';
  }

  // Canonical page source, captured before the first render (never the live DOM)
  var SCRIPT_SRC = document.currentScript.textContent;
  var STYLE_SRC = document.querySelector('style').textContent;
  var MAIN_SRC = document.querySelector('main').outerHTML;
  var HEAD_LINKS = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">';

  function docWithState(){
    var json = JSON.stringify({sessions:STATE.sessions}).replace(/</g,'\\u003c');
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
      '<title>Backyard shooting log</title>\n'+HEAD_LINKS+'\n<style>'+STYLE_SRC+'</style>\n</head>\n<body>\n'+MAIN_SRC+
      '\n\n<script id="state" type="application/json">'+json+'<\/script>\n<script>'+SCRIPT_SRC+'<\/script>\n</body>\n</html>\n';
  }

  async function persist(){
    try { localStorage.setItem(LS_KEY, JSON.stringify({sessions:STATE.sessions})); } catch(e){}
    if(!artifact || readOnly){ return 'local'; }
    var html = docWithState();
    try { await artifact.publish(html); try{localStorage.removeItem(LS_KEY);}catch(e){} return 'saved'; }
    catch(e){
      if(e && (e.code==='not_writer'||e.code==='not_granted'||e.code==='consent_required'||e.code==='capability_disabled'||e.code==='not_declared')){ readOnly=true; setNote(); }
      if(e && e.code==='conflict') return 'conflict';
      return 'local';
    }
  }

  function setNote(){
    $('note').textContent = artifact && !readOnly
      ? 'Sessions save to this page, so they show up on any device you open it on.'
      : 'Saving on this device only.';
  }

  $('date').value = new Date().toLocaleDateString('en-CA');

  $('f').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var m=parseInt($('makes').value,10), a=parseInt($('att').value,10);
    var st=$('streak').value.trim(), bl=$('blocks').value.trim();
    var err='';
    if(!$('date').value) err='Pick a date.';
    else if(isNaN(m)||isNaN(a)) err='Enter makes and attempts.';
    else if(a<1) err='Attempts must be at least 1.';
    else if(m<0||m>a) err='Makes can\'t be more than attempts.';
    else if(st!==''&&(+st<0||+st>m)) err='Best streak can\'t be more than makes.';
    var blocks = bl? bl.split(/[\s,]+/).filter(Boolean).map(Number) : [];
    if(!err && blocks.some(function(b){ return isNaN(b)||b<0||b>10; })) err='Per-10 numbers must be between 0 and 10.';
    $('err').textContent=err; if(err) return;

    STATE.sessions.push({id:'s'+Date.now(),date:$('date').value,makes:m,att:a,streak:st===''?'':+st,spot:$('spot').value,blocks:blocks});
    render();
    $('save').disabled=true; $('save').textContent='Saving...';
    var r = await persist();
    $('save').disabled=false; $('save').textContent='Save session';
    if(r!=='conflict'){ $('makes').value=''; $('streak').value=''; $('blocks').value=''; }
  });

  $('log').addEventListener('click', async function(ev){
    var b=ev.target.closest('.del'); if(!b) return;
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap again to delete'; setTimeout(function(){ if(b.isConnected){ b.dataset.armed=''; b.textContent='Delete'; } },4000); return; }
    STATE.sessions = STATE.sessions.filter(function(s){ return s.id!==b.dataset.id; });
    render(); await persist();
  });

  // ---- Live session ----
  var DKEY='shotlog-draft', TARGET=50;
  var draft={shots:'',spot:''};
  try{ var d=JSON.parse(localStorage.getItem(DKEY)||'null'); if(d&&typeof d.shots==='string') draft=d; }catch(e){}
  function saveDraft(){ try{ localStorage.setItem(DKEY,JSON.stringify(draft)); }catch(e){} }
  function calc(str){
    var m=0,best=0,cur=0,blocks=[];
    for(var i=0;i<str.length;i++){
      var hit=str.charAt(i)==='X'; if(hit){m++;cur++; if(cur>best)best=cur;} else cur=0;
      if(i%10===0) blocks.push(0); if(hit) blocks[blocks.length-1]++;
    }
    return {makes:m,att:str.length,best:best,cur:cur,blocks:blocks};
  }
  function renderLive(){
    var str=draft.shots, c=calc(str), html='';
    if(!str){ html='<span class="empty">Tap Make or Miss after each shot. Progress is kept if you close the page.</span>'; }
    else{
      for(var i=0;i<str.length;i+=5){
        var g=str.slice(i,i+5), full=g.length===5;
        html+='<span class="grp'+(full?'':' cur')+'">'+g.split('').map(function(ch){ return '<b class="'+(ch==='X'?'m':'x')+'">'+ch+'</b>'; }).join('')+'</span>';
      }
    }
    $('shots').innerHTML=html;
    $('livestats').innerHTML = str
      ? '<span>Shot <b>'+c.att+'</b> of '+TARGET+'</span><span><b>'+c.makes+'/'+c.att+'</b> made</span><span><b>'+Math.round(pct(c.makes,c.att))+'%</b></span><span>Current streak <b>'+c.cur+'</b></span><span>Best <b>'+c.best+'</b></span>'
      : '';
    var hit=c.att>=TARGET;
    $('done').className='done'+(hit?' show':'');
    $('done').textContent= hit ? TARGET+' shots done: '+c.makes+'/'+c.att+' ('+Math.round(pct(c.makes,c.att))+'%). Tap Finish to save.' : '';
    $('bFinish').classList.toggle('pulse',hit);
    $('bUndo').disabled=!str; $('bFinish').disabled=!str || readOnly;
    $('liveSpot').value=draft.spot||'';
  }
  function shot(ch){
    draft.shots+=ch; saveDraft(); renderLive();
    var n=draft.shots.length;
    try{ if(navigator.vibrate) navigator.vibrate(n===TARGET?[300,120,300,120,300]:(ch==='X'?20:[10,40,10])); }catch(e){}
    if(n===TARGET){ try{ $('done').scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} }
  }
  $('bMake').addEventListener('click',function(){ shot('X'); });
  $('bMiss').addEventListener('click',function(){ shot('O'); });
  $('bUndo').addEventListener('click',function(){ draft.shots=draft.shots.slice(0,-1); saveDraft(); renderLive(); });
  $('liveSpot').addEventListener('change',function(){ draft.spot=this.value; saveDraft(); });
  $('bFinish').addEventListener('click', async function(){
    var c=calc(draft.shots); if(!c.att) return;
    var btn=this;
    if(btn.dataset.armed!=='1'){
      btn.dataset.armed='1'; btn.textContent='Tap again to save '+c.makes+'/'+c.att+' ('+Math.round(pct(c.makes,c.att))+'%)';
      clearTimeout(btn._t); btn._t=setTimeout(function(){ btn.dataset.armed=''; btn.textContent='Finish and save session'; },5000);
      return;
    }
    clearTimeout(btn._t); btn.dataset.armed='';
    STATE.sessions.push({id:'s'+Date.now(),date:new Date().toLocaleDateString('en-CA'),makes:c.makes,att:c.att,streak:c.best,spot:draft.spot||'',blocks:c.blocks,shots:draft.shots});
    draft={shots:'',spot:''}; saveDraft();
    render(); renderLive();
    this.disabled=true; this.textContent='Saving...';
    await persist();
    this.textContent='Finish and save session'; renderLive();
  });

  $('bExport').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify({sessions:STATE.sessions},null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='shot-log-'+new Date().toLocaleDateString('en-CA')+'.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  });
  $('fImport').addEventListener('change',function(){
    var f=this.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){ try{ var d=JSON.parse(r.result); if(!Array.isArray(d.sessions)) throw 0;
      var ids={}; STATE.sessions.forEach(function(s){ids[s.id]=1;}); var added=0;
      d.sessions.forEach(function(s){ if(s&&s.id&&!ids[s.id]&&typeof s.makes==='number'&&typeof s.att==='number'){ STATE.sessions.push(s); added++; } });
      persist(); render(); alert(added+' session(s) restored.'); }catch(e){ alert('That file isn\'t a shot log backup.'); } };
    r.readAsText(f); this.value='';
  });

  render(); renderLive(); setNote();

  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(ns){ artifact=ns; setNote(); render(); }).catch(function(){});
  }
})();
</script>
</body>
</html>
